# ClearMaxx AI backend — deployed as its OWN App Engine service ("clearmaxx")
# so it does not overwrite the existing "default" service in the same project.
# URL: https://clearmaxx-dot-faraz-mobile-apps.uc.r.appspot.com
#
# NOTE: there is intentionally NO API key. Gemini runs on VERTEX AI, authenticated
# by the App Engine service account (roles/aiplatform.user) via ADC. The app token
# is read at runtime from Secret Manager (secret: clearmaxx-app-token).
# GOOGLE_CLOUD_PROJECT is injected automatically by App Engine.
service: clearmaxx
runtime: python311
entrypoint: gunicorn -b :$PORT --workers 1 --threads 8 --timeout 120 main:app

instance_class: F2

env_variables:
  VERTEX_LOCATION: "us-central1"

automatic_scaling:
  max_instances: 5
  min_idle_instances: 0
